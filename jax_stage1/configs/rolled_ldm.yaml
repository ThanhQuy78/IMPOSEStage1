# IMPOSE Stage 1 — Rolled LDM Configuration
# JAX/Flax reimplementation targeting Kaggle TPU v3-8

model:
  learning_rate: 2.0e-5
  warmup_steps: 500

  unet:
    image_size: 128
    in_channels: 3
    out_channels: 3
    model_channels: 64
    channel_mult: [1, 2, 4]
    num_res_blocks: 2
    attention_resolutions: [32, 16, 8]   # ds values; effectively no attn in enc/dec
    num_heads: 8
    use_scale_shift_norm: true
    resblock_updown: true
    dropout: 0.0

  diffusion:
    timesteps: 1000
    beta_schedule: linear
    linear_start: 0.0015
    linear_end: 0.0155
    loss_type: l1
    parameterization: eps       # predict noise
    scale_by_std: true

  first_stage:
    embed_dim: 3
    n_embed: 4096
    z_channels: 3
    resolution: 512
    in_channels: 1
    out_ch: 1
    ch: 64
    ch_mult: [1, 2, 4]
    num_res_blocks: 2
    attn_resolutions: [16]
    double_z: false
    dropout: 0.0

  ema:
    decay: 0.9999
    use_num_updates: true

data:
  dataset_path: "/kaggle/input/datasets/poseidon127/sd302a/archive/images/challengers"
  image_size: 512
  batch_size: 48              # 6 per TPU core × 8 cores
  pre_encode_batch_size: 2    # VQ-VAE encode batch; keep small to avoid OOM
  # Optional precomputed scaled latents, shape (N, 128, 128, 3), .npy.
  # If this file exists, training skips image loading and VQ-VAE encoding.
  # Example on Kaggle:
  # latent_cache_path: "/kaggle/input/<latent-cache-dataset>/sd302a_rolled_latents.npy"
  latent_cache_path: "/kaggle/working/sd302a_rolled_latents.npy"
  num_workers: 4
  shuffle_buffer: 4096

training:
  max_steps: 500000
  log_every_n_steps: 100
  sample_every_n_steps: 2000
  save_every_n_steps: 5000
  gradient_clip_norm: 1.0
  seed: 42

sampling:
  ddim_steps: 50
  ddim_eta: 0.0
  n_samples: 16

paths:
  vqvae_ckpt: "models/fingerprint_ldm_rolled_512/model_ldm_rolled.ckpt"
  # Read-only dir with vqvae_params.npz + scale_factor.npy
  # On Kaggle: point to /kaggle/input/<dataset>/converted
  converted_vqvae_dir: "/kaggle/input/datasets/poseidon127/impose/kaggle_assets/converted"
  # Writable dir for UNet training checkpoints
  output_dir: "/kaggle/working/jax_stage1/outputs"
  checkpoint_dir: "/kaggle/working/jax_stage1/checkpoints"
